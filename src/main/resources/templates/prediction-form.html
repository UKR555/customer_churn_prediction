<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Customer Churn - Grocery Churn Predictor</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Grocery Churn Predictor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/predict">Predict</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <h1 class="mb-4">Predict Customer Churn</h1>
                <p class="lead mb-4">
                    Enter customer details below to predict whether they are likely to churn.
                </p>
                
                <div class="card shadow">
                    <div class="card-body">
                        <form th:action="@{/predict}" th:object="${predictionRequest}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="age" class="form-label">Age</label>
                                    <input type="number" class="form-control" id="age" th:field="*{age}" required min="18" max="100">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="gender" class="form-label">Gender</label>
                                    <select class="form-select" id="gender" th:field="*{gender}" required>
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="income" class="form-label">Annual Income</label>
                                    <input type="number" class="form-control" id="income" th:field="*{income}" required min="0" step="1000">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="shoppingFrequency" class="form-label">Shopping Frequency</label>
                                    <select class="form-select" id="shoppingFrequency" th:field="*{shoppingFrequency}" required>
                                        <option value="">Select Frequency</option>
                                        <option value="Weekly">Weekly</option>
                                        <option value="Biweekly">Biweekly</option>
                                        <option value="Monthly">Monthly</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="avgBasketValue" class="form-label">Average Basket Value ($)</label>
                                    <input type="number" class="form-control" id="avgBasketValue" th:field="*{avgBasketValue}" required min="0" step="0.01">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="loyaltyCardMember" class="form-label">Loyalty Card Member</label>
                                    <select class="form-select" id="loyaltyCardMember" th:field="*{loyaltyCardMember}" required>
                                        <option value="">Select Option</option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="onlineShoppingUsage" class="form-label">Online Shopping Usage</label>
                                    <select class="form-select" id="onlineShoppingUsage" th:field="*{onlineShoppingUsage}" required>
                                        <option value="">Select Usage Level</option>
                                        <option value="Low">Low</option>
                                        <option value="Medium">Medium</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="daysLastPurchase" class="form-label">Days Since Last Purchase</label>
                                    <input type="number" class="form-control" id="daysLastPurchase" th:field="*{daysLastPurchase}" required min="0" max="365">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="totalPurchaseAmount" class="form-label">Total Purchase Amount ($)</label>
                                    <input type="number" class="form-control" id="totalPurchaseAmount" th:field="*{totalPurchaseAmount}" required min="0" step="0.01">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="totalVisits" class="form-label">Total Store Visits (Last Year)</label>
                                    <input type="number" class="form-control" id="totalVisits" th:field="*{totalVisits}" required min="0" max="365">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="complaintsMade" class="form-label">Complaints Made</label>
                                    <input type="number" class="form-control" id="complaintsMade" th:field="*{complaintsMade}" required min="0" max="10">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="specialOffersRedeemed" class="form-label">Special Offers Redeemed</label>
                                    <input type="number" class="form-control" id="specialOffersRedeemed" th:field="*{specialOffersRedeemed}" required min="0">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="feedbackScore" class="form-label">Feedback Score (1-5)</label>
                                    <input type="number" class="form-control" id="feedbackScore" th:field="*{feedbackScore}" required min="1" max="5" step="0.1">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="preferredPaymentMethod" class="form-label">Preferred Payment Method</label>
                                    <select class="form-select" id="preferredPaymentMethod" th:field="*{preferredPaymentMethod}" required>
                                        <option value="">Select Payment Method</option>
                                        <option value="Credit Card">Credit Card</option>
                                        <option value="Debit Card">Debit Card</option>
                                        <option value="Cash">Cash</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="preferredStoreLocation" class="form-label">Preferred Store Location</label>
                                    <select class="form-select" id="preferredStoreLocation" th:field="*{preferredStoreLocation}" required>
                                        <option value="">Select Location</option>
                                        <option value="Downtown">Downtown</option>
                                        <option value="Suburb">Suburb</option>
                                        <option value="Mall">Mall</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="reset" class="btn btn-secondary me-md-2">Reset</button>
                                <button type="submit" class="btn btn-primary">Predict Churn</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-center text-white py-4 mt-5">
        <div class="container">
            <p class="mb-0">© 2023 Grocery Churn Predictor. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="/webjars/jquery/3.6.1/jquery.min.js"></script>
    <script src="/webjars/bootstrap/5.2.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
